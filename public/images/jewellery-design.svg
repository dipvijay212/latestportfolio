<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#FDFBF7"/>
  
  <!-- Browser Frame Header -->
  <rect width="800" height="42" fill="#0F172A"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="80" y="10" width="280" height="22" rx="6" fill="#1E293B"/>
  <text x="96" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">jewellerydesign.studio</text>
  
  <!-- Website Header -->
  <rect x="24" y="58" width="752" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="44" y="88" fill="#1E293B" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">JEWELLERY DESIGN STUDIO</text>
  <rect x="310" y="74" width="95" height="20" rx="10" fill="#FEF3C7"/>
  <text x="320" y="88" fill="#92400E" font-family="system-ui, sans-serif" font-size="10" font-weight="600">FINE JEWELLERY</text>
  
  <!-- Navigation Links -->
  <text x="475" y="87" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Collections</text>
  <text x="560" y="87" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Lookbook</text>
  <rect x="640" y="69" width="120" height="28" rx="6" fill="#D97706"/>
  <text x="653" y="87" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">View Catalog</text>

  <!-- Filter Bar -->
  <rect x="24" y="120" width="752" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="144" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CATEGORY:</text>
  <rect x="120" y="128" width="85" height="22" rx="4" fill="#FEF3C7"/>
  <text x="131" y="143" fill="#B45309" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Diamond Rings</text>
  <rect x="215" y="128" width="100" height="22" rx="4" fill="#F1F5F9"/>
  <text x="227" y="143" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Necklace Sets</text>
  <rect x="325" y="128" width="90" height="22" rx="4" fill="#F1F5F9"/>
  <text x="338" y="143" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Bridal Sets</text>
  <rect x="425" y="128" width="90" height="22" rx="4" fill="#F1F5F9"/>
  <text x="442" y="143" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Earrings</text>

  <!-- Product Cards Grid -->
  <!-- Card 1: Solitaire Ring -->
  <g transform="translate(24, 172)">
    <rect width="237" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="12" width="213" height="170" rx="8" fill="#FFFBEB"/>
    <rect x="24" y="24" width="85" height="20" rx="4" fill="#D97706"/>
    <text x="32" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SIGNATURE</text>
    
    <!-- Jewelry Graphic (Diamond Solitaire) -->
    <circle cx="118" cy="97" r="38" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.6"/>
    <polygon points="118,65 136,80 128,102 108,102 100,80" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <polygon points="118,65 125,80 118,102 111,80" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    
    <text x="14" y="206" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Solitaire Diamond Ring</text>
    <text x="14" y="224" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">18K Solid Gold • Handcrafted</text>
    <rect x="14" y="245" width="209" height="34" rx="6" fill="#0F172A"/>
    <text x="78" y="266" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">View Product</text>
  </g>

  <!-- Card 2: Royal Bridal Necklace -->
  <g transform="translate(281, 172)">
    <rect width="237" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="12" width="213" height="170" rx="8" fill="#FEF3C7"/>
    <rect x="24" y="24" width="75" height="20" rx="4" fill="#B45309"/>
    <text x="32" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">HERITAGE</text>
    
    <!-- Jewelry Graphic (Necklace Curve) -->
    <path d="M 80,75 Q 118,135 156,75" stroke="#D97706" stroke-width="3" fill="none"/>
    <circle cx="118" cy="115" r="9" fill="#059669" stroke="#D97706" stroke-width="1.5"/>
    <circle cx="98" cy="98" r="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    <circle cx="138" cy="98" r="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
    
    <text x="14" y="206" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Royal Heritage Choker</text>
    <text x="14" y="224" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Kundan &amp; Emeralds • 22K Hallmarked</text>
    <rect x="14" y="245" width="209" height="34" rx="6" fill="#0F172A"/>
    <text x="78" y="266" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">View Product</text>
  </g>

  <!-- Card 3: Emerald Drop Earrings -->
  <g transform="translate(539, 172)">
    <rect width="237" height="300" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="12" width="213" height="170" rx="8" fill="#ECFDF5"/>
    <rect x="24" y="24" width="80" height="20" rx="4" fill="#047857"/>
    <text x="32" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">HANDCRAFTED</text>
    
    <!-- Jewelry Graphic (Earrings Pair) -->
    <g transform="translate(98, 70)">
      <circle cx="0" cy="0" r="5" fill="#F59E0B"/>
      <path d="M 0,5 L 0,16" stroke="#D97706" stroke-width="1.5"/>
      <polygon points="0,16 9,28 0,42 -9,28" fill="#10B981" stroke="#047857" stroke-width="1"/>
    </g>
    <g transform="translate(138, 70)">
      <circle cx="0" cy="0" r="5" fill="#F59E0B"/>
      <path d="M 0,5 L 0,16" stroke="#D97706" stroke-width="1.5"/>
      <polygon points="0,16 9,28 0,42 -9,28" fill="#10B981" stroke="#047857" stroke-width="1"/>
    </g>
    
    <text x="14" y="206" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Artisan Emerald Drops</text>
    <text x="14" y="224" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Natural Emeralds • 18K Yellow Gold</text>
    <rect x="14" y="245" width="209" height="34" rx="6" fill="#0F172A"/>
    <text x="78" y="266" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">View Product</text>
  </g>
</svg>