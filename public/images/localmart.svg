    <text x="24" y="32" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Merchant Dispatch Console</text>
    <rect x="270" y="14" width="108" height="22" rx="4" fill="#DCFCE7"/>
    <text x="280" y="29" fill="#15803D" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Radius: 3.0 KM Active</text>

    <!-- Map representation block -->
    <rect x="24" y="66" width="354" height="150" rx="10" fill="#E2E8F0"/>
    <!-- Simulated map roads -->
    <path d="M40 100 Q150 160 360 80" stroke="#CBD5E1" stroke-width="12" fill="none"/>
    <path d="M120 70 L220 210" stroke="#CBD5E1" stroke-width="8" fill="none"/>
    <circle cx="200" cy="140" r="14" fill="#4F46E5" fill-opacity="0.2"/>
    <circle cx="200" cy="140" r="6" fill="#4F46E5"/>
    <circle cx="100" cy="110" r="8" fill="#10B981"/>
    <circle cx="280" cy="120" r="8" fill="#EF4444"/>

    <!-- Order stream items -->
    <g transform="translate(24, 230)">
      <rect width="354" height="66" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ORDER #LM-924 • 12 MINS AGO</text>
      <text x="16" y="46" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Customer: Ananya R. • 2x Toned Milk, 1x Bread</text>
      <rect x="250" y="18" width="90" height="28" rx="6" fill="#10B981"/>
      <text x="264" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Dispatched</text>
    </g>

    <g transform="translate(24, 308)">
      <rect width="354" height="66" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ORDER #LM-925 • JUST NOW</text>
      <text x="16" y="46" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Customer: Vikas S. • Fresh Vegetables basket</text>
      <rect x="250" y="18" width="90" height="28" rx="6" fill="#4F46E5"/>
      <text x="270" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Accept</text>
    </g>

    <!-- Operational highlight -->
    <rect x="24" y="390" width="354" height="42" rx="8" fill="#F1F5F9"/>
    <text x="36" y="415" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Geo-Fenced Dispatch • Real-Time Socket Updates</text>
  </g>
