<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  
  <!-- Left Side: Phone Screen Mockup -->
  <g transform="translate(48, 24)">
    <rect width="270" height="452" rx="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <rect x="95" y="10" width="80" height="14" rx="7" fill="#0F172A"/>

    <!-- App Top Bar -->
    <rect x="16" y="36" width="238" height="42" rx="8" fill="#F1F5F9"/>
    <circle cx="32" cy="57" r="6" fill="#EF4444"/>
    <text x="46" y="54" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Delivering to Sector 14</text>
    <text x="46" y="68" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Within 1.5 km • 15-25 mins</text>

    <!-- Categories -->
    <g transform="translate(16, 88)">
      <rect width="52" height="24" rx="12" fill="#4F46E5"/>
      <text x="13" y="104" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">All</text>
      
      <rect x="58" width="60" height="24" rx="12" fill="#F1F5F9"/>
      <text x="68" y="104" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Groceries</text>

      <rect x="124" width="54" height="24" rx="12" fill="#F1F5F9"/>
      <text x="134" y="104" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Dairy</text>

      <rect x="184" width="54" height="24" rx="12" fill="#F1F5F9"/>
      <text x="194" y="104" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Pharma</text>
    </g>

    <!-- Store Card 1 -->
    <g transform="translate(16, 122)">
      <rect width="238" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="10" y="10" width="54" height="54" rx="8" fill="#DCFCE7"/>
      <text x="16" y="42" fill="#15803D" font-family="system-ui, sans-serif" font-size="20">🏪</text>
      <text x="74" y="30" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Gupta Daily Fresh</text>
      <text x="74" y="46" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">0.4 km away • Open now</text>
      <rect x="74" y="54" width="60" height="18" rx="4" fill="#FEF3C7"/>
      <text x="80" y="67" fill="#B45309" font-family="system-ui, sans-serif" font-size="9" font-weight="600">★ 4.8 (120+)</text>
    </g>

    <!-- Store Card 2 -->
    <g transform="translate(16, 222)">
      <rect width="238" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="10" y="10" width="54" height="54" rx="8" fill="#EFF6FF"/>
      <text x="16" y="42" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="20">💊</text>
      <text x="74" y="30" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Apollo Med &amp; Wellness</text>
      <text x="74" y="46" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">0.9 km away • Open now</text>
      <rect x="74" y="54" width="60" height="18" rx="4" fill="#DCFCE7"/>
      <text x="80" y="67" fill="#15803D" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Free Delivery</text>
    </g>

    <!-- Bottom Cart Action -->
    <rect x="16" y="380" width="238" height="44" rx="10" fill="#0F172A"/>
    <text x="32" y="407" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">View Active Cart (3 items)</text>
    <text x="200" y="407" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">₹340</text>
  </g>

  <!-- Right Side: Merchant Management Panel -->
  <g transform="translate(350, 24)">
    <rect width="402" height="452" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    
    <!-- Header -->
