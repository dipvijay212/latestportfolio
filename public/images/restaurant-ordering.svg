<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  
  <!-- Browser Frame Header -->
  <rect width="800" height="42" fill="#0F172A"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="80" y="10" width="300" height="22" rx="6" fill="#1E293B"/>
  <text x="96" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">restaurant-pos.app/live-kitchen</text>
  
  <!-- App Top Bar -->
  <rect x="24" y="58" width="752" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="44" y="87" fill="#0F172A" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Gusto Kitchen &amp; POS Display</text>
  <rect x="260" y="70" width="90" height="22" rx="4" fill="#DCFCE7"/>
  <circle cx="272" cy="81" r="3" fill="#16A34A"/>
  <text x="282" y="86" fill="#15803D" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sync: Live</text>
  <text x="640" y="86" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Active Tickets: 8</text>

  <!-- Split View: Left Mobile Guest View, Right Kitchen Display Board -->
  <!-- Left Side: Mobile Order Frame -->
  <g transform="translate(24, 116)">
    <rect width="260" height="360" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="100" y="8" width="60" height="6" rx="3" fill="#E2E8F0"/>
    
    <!-- Mobile Screen Header -->
    <text x="20" y="40" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Table #04 Order</text>
    <text x="20" y="56" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Dine-in • 2 Guests</text>

    <!-- Item 1 -->
    <rect x="16" y="70" width="228" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="28" y="92" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Truffle Wild Mushroom Pizza</text>
    <text x="28" y="108" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Extra cheese • Thin crust</text>
    <rect x="195" y="84" width="38" height="24" rx="4" fill="#4F46E5"/>
    <text x="203" y="100" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1x</text>

    <!-- Item 2 -->
    <rect x="16" y="130" width="228" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="28" y="152" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fresh Basil Pesto Pasta</text>
    <text x="28" y="168" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Gluten-free penne</text>
    <rect x="195" y="144" width="38" height="24" rx="4" fill="#4F46E5"/>
    <text x="203" y="160" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2x</text>

    <!-- Cart Bottom Summary -->
    <rect x="16" y="300" width="228" height="44" rx="8" fill="#0F172A"/>
    <text x="32" y="327" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Order Sent to Kitchen</text>
    <circle cx="215" cy="322" r="8" fill="#10B981"/>
    <path d="M211 322L214 325L219 319" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Right Side: Kitchen Display Cards -->
  <!-- Ticket 1 -->
  <g transform="translate(304, 116)">
    <rect width="228" height="360" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="228" height="42" rx="10" fill="#FEE2E2"/>
    <text x="16" y="26" fill="#991B1B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">TICKET #108 • TABLE 4</text>
    <text x="16" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Time: 4 mins ago</text>
    <line x1="16" y1="68" x2="212" y2="68" stroke="#E2E8F0"/>

    <text x="16" y="92" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1x Truffle Mushroom Pizza</text>
    <text x="28" y="108" fill="#DC2626" font-family="system-ui, sans-serif" font-size="10">Note: Extra cheese, thin crust</text>

    <text x="16" y="136" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2x Basil Pesto Pasta</text>
    <text x="28" y="152" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Note: Gluten-free</text>

    <rect x="16" y="306" width="196" height="38" rx="6" fill="#F59E0B"/>
    <text x="64" y="330" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">In Preparation</text>
  </g>

  <!-- Ticket 2 -->
  <g transform="translate(548, 116)">
    <rect width="228" height="360" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect width="228" height="42" rx="10" fill="#DCFCE7"/>
    <text x="16" y="26" fill="#166534" font-family="system-ui, sans-serif" font-size="13" font-weight="700">TICKET #107 • TAKEAWAY</text>
    <text x="16" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Customer: Michael S.</text>
    <line x1="16" y1="68" x2="212" y2="68" stroke="#E2E8F0"/>

    <text x="16" y="92" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2x Grilled Chicken Caesar</text>
    <text x="16" y="122" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1x Hand-cut Fries (L)</text>
    <text x="16" y="152" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2x San Pellegrino Aranciata</text>

